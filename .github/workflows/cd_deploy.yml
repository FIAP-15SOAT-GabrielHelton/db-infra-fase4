name: CD Deploy (RDS PostgreSQL)

# Disparo manual — as credenciais AWS Academy são passadas como inputs porque
# tokens de sessão expiram em ~4h e não podem ser armazenados como secrets fixos.
#
# Pré-requisito: o repositório k8s-infra precisa ter sido implantado antes
# (publica vpc_id/subnet_ids no SSM que este workflow lê).
on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID (AWS Academy)'
        required: true
        type: string
      aws_secret_access_key:
        description: 'AWS Secret Access Key (AWS Academy)'
        required: true
        type: string
      aws_session_token:
        description: 'AWS Session Token (AWS Academy)'
        required: true
        type: string

concurrency:
  group: oficina-mecanica-db-infra
  cancel-in-progress: true

jobs:
  deploy:
    name: Provision RDS PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Mask Sensitive Credentials
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"
          echo "::add-mask::${{ secrets.DB_PASSWORD }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: us-east-1

      - name: Bootstrap S3 Backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TF_BUCKET="oficina-mecanica-tfstate-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$TF_BUCKET" 2>/dev/null; then
            echo "Bucket $TF_BUCKET já existe. Reutilizando..."
          else
            echo "Criando bucket $TF_BUCKET..."
            aws s3api create-bucket --bucket "$TF_BUCKET" --region us-east-1
          fi

          echo "TF_BUCKET=$TF_BUCKET" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # Provisiona o RDS PostgreSQL e publica rds_address/rds_endpoint no SSM
      # Parameter Store para o repositório api consumir.
      - name: Terraform Provisioning
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          cd infra/
          terraform init \
            -backend-config="bucket=$TF_BUCKET" \
            -backend-config="key=oficina-mecanica/db-infra.tfstate" \
            -backend-config="region=us-east-1"

          terraform apply -auto-approve

      # Cria um usuário e os bancos de cada microsserviço (OS e Billing), isolados entre si:
      # cada serviço só recebe a senha do seu usuário, e a senha master fica só neste repositório.
      - name: Bootstrap Service Databases
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OS_DB_PASSWORD: ${{ secrets.OS_DB_PASSWORD }}
          BILLING_DB_PASSWORD: ${{ secrets.BILLING_DB_PASSWORD }}
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name /oficina-mecanica/eks_cluster_name --query 'Parameter.Value' --output text)
          RDS_HOST=$(terraform -chdir=infra output -raw rds_address)
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region us-east-1

          kubectl create configmap db-bootstrap-sql --from-file=k8s/bootstrap.sql \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic db-bootstrap \
            --from-literal=PGHOST="$RDS_HOST" \
            --from-literal=PGPASSWORD="$DB_PASSWORD" \
            --from-literal=OS_DB_PASSWORD="$OS_DB_PASSWORD" \
            --from-literal=BILLING_DB_PASSWORD="$BILLING_DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete job db-bootstrap --ignore-not-found=true
          kubectl apply -f k8s/db-bootstrap-job.yaml
          kubectl wait --for=condition=complete --timeout=300s job/db-bootstrap

          # As senhas não precisam ficar no cluster depois do bootstrap.
          kubectl delete secret db-bootstrap
